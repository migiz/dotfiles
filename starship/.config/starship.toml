# "$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
command_timeout = 200

format = """\
[╭╴](fg:arrow)\
   󰣇 \
   $directory\
   $git_branch$git_commit$git_state $git_status\

$fill $cmd_duration \

(\
 $elixir\
 $erlang\
 $golang\
 $haskell\
 $helm\
 $java\
 $lua\
 $nodejs\
 $python\
 $ruby\
 $rust\
 $kubernetes\
 $fennel\
 $terraform\
 $gcloud\
 $openstack\
 $azure\
 $custom\
 $status\
 $os\
 $time\

)
[╰─](fg:arrow)$character\
"""

# Active palette. Toggle by swapping this between the two blocks below.
palette = "everforest_dark"

# Everforest Dark Medium, using Catppuccin's key names so the rest of the
# config (fg:blue, bg:overlay1, fg:peach, ...) is a drop-in.
