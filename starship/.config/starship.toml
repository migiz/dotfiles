# style_choices:
# bold
# italic
# underline
# dimmed
# inverted
# blink
# hidden
# strikethrough
# bg:<color>
# fg:<color>
# <color>
# none

[character]
vimcmd_symbol = "[NORMAL ❯](green)"
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
format = "$symbol "

[directory]
disabled = false
format = "[$path](bold fg:blue)"
truncate_to_repo = false
read_only = " 󰌾"

[git_branch]
format = "[  $branch](fg:green)"

[git_status]
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
format = '[[( $all_status$ahead_behind )](fg:peach)]($style)'
style = "bg:overlay1"

[time]
disabled = false
format = '[[ $time ](fg:overlay2)]($style)'
time_format = "%R"                           # Hour:Minute Format

[lua]
format = "[${symbol} ]($style)"
style = "bold bright-yellow"
symbol = " "
version_format = "${raw}"

[nodejs]
detect_extensions = []
detect_files = ["package-lock.json", "yarn.lock"]
detect_folders = ["node_modules"]
format = "[${symbol}${version} ]($style)"
version_format = "${raw}"
symbol = " "

[python]
format = "[${symbol}(${virtualenv})${version} ]($style)"
style = "bold bright-yellow"
symbol = " "
version_format = "${raw}"

[ruby]
format = "[${symbol} ]($style)"
style = "bold red"
symbol = " "
version_format = "${raw}"

[rust]
style = "bold bright-red"
format = "$symbol($style) "
symbol = "󱘗 "

[elixir]
style = "bold bright-yellow"
format = "[$symbol OTP $otp_version ]($style)"
symbol = " "

[golang]
style = "bold bright-blue"
format = "[$symbol ]($style)"
symbol = " "

[haskell]
style = "bold bright-yellow"
format = "[$symbol ]($style)"
symbol = "❯λ "

[java]
style = "bold bright-red"
format = "[${symbol} ]($style)"
symbol = " "

[kubernetes]
style = "bold bright-cyan"
format = "[kubernetes](italic) [$symbol]($style)"
symbol = " "

[erlang]
style = "bold bright-yellow"
format = "[erlang](italic) [$symbol]($style)"
symbol = " "

[fennel]
style = "bold bright-cyan"
format = "[fennel](italic) [$symbol]($style)"
symbol = " "

[helm]
style = "bold bright-yellow"
format = "[helm](italic) [$symbol]($style)"
symbol = "helm "

[terraform]
style = "bold bright-cyan"
format = "[terraform](italic) [$symbol]($style)"
symbol = "terraform "

[gcloud]
format = "[gcloud](italic) [$symbol]($style)"
style = "bold bright-cyan"
symbol = "gcloud "

[openstack]
format = "[openstack](italic) [$symbol]($style)"
style = "bold bright-red"
symbol = "openstack "

[azure]
format = "[azure](italic) [$symbol]($style)"
style = "bold bright-yellow"
symbol = " "

[os.symbols]
Arch = " "
EndeavourOS = " "
Kali = " "
Linux = " "
Macos = " "
NixOS = " "
Pop = " "
Raspbian = " "
Ubuntu = " "
Unknown = " "
Windows = "󰍲 "
