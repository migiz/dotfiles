# ===== BASIC CONFIGURATION =====

# Remap prefix from C-b to C-w
set -g prefix C-w
unbind C-b
bind-key C-w send-prefix

# Set fish as default shell
set -g default-shell /usr/bin/fish

# Enable mouse support
set-option -g mouse on

# Allow programs to access clipboard
set -g allow-passthrough on

# Monitor window activity
setw -g monitor-activity on

# Update status bar every 2 seconds
set -g status-interval 2

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1


# ===== KEY BINDINGS =====

# Reload config file
unbind r
bind r source-file ~/.tmux.conf

# Window splitting
bind s split-window -v
bind v split-window -h

# Pane navigation (vim-style)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Pane resizing (vim-style, repeatable)
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# Scroll without prefix
bind -n M-k if-shell -F '#{pane_in_mode}' \
  'send-keys -X halfpage-up' \
  'copy-mode -e; send-keys -X halfpage-up'
bind -n M-j if-shell -F '#{pane_in_mode}' \
  'send-keys -X halfpage-down' \
  'copy-mode -e; send-keys -X halfpage-down'

# Toggle copy mode
bind -n C-g if-shell -F '#{pane_in_mode}' 'send-keys -X cancel' 'copy-mode -e'

# Toggle pane synchronization
bind y setw synchronize-panes

# Kill pane without confirmation
bind-key x kill-pane


# ===== WINDOW & PANE SETTINGS =====

# Use vi key bindings in copy mode
setw -g mode-keys vi

# Automatic window renaming
set -wg automatic-rename on
set -g automatic-rename-format "Window"

# Pane border configuration
setw -g pane-border-status top
setw -g pane-border-format ""
setw -g pane-border-lines single


# ===== PLUGIN MANAGEMENT =====

# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Essential plugins
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Session persistence
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Link extraction and opening
set -g @plugin 'alberti42/tmux-fzf-links'

# Visual enhancements
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'catppuccin/tmux'


# ===== PLUGIN CONFIGURATION =====

# Resurrect settings
set -g @resurrect-capture-pane-contents 'off'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'

# FZF-Links configuration
set-option -g @fzf-links-key i
set-option -g @fzf-links-editor-open-cmd "tmux new-window -n 'nvim' /usr/bin/nvim '%file'"
set-option -g @fzf-links-browser-open-cmd "/usr/bin/brave '%url'"
set-option -g @fzf-links-user-schemes-path "~/.tmux/plugins/tmux-fzf-links/user_schemes/user_schemes.py"

# Catppuccin theme configuration
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"


# ===== THEME & STATUS BAR =====

# Status bar position and style
set -g status-position top
set -g status-style "bg=#{@thm_bg}"
set -g status-justify "absolute-centre"

# Status left configuration
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]  #S },#{#[bg=#{@thm_bg},fg=#{@thm_green}]  #S }}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_maroon}]  #{pane_current_command} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"

# Status right configuration
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#[bg=default,fg=#{@thm_green},bold] 󰍛 #{cpu_percentage} "
set -ga status-right "#[bg=default,fg=#{@thm_overlay0},none,bold]│"
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_blue}] 󰭦 %Y-%m-%d 󰅐 %H:%M "

# Pane border styling
setw -g pane-active-border-style "bg=#{@thm_bg},fg=#{@thm_overlay_0}"
setw -g pane-border-style "bg=#{@thm_bg},fg=#{@thm_surface_0}"

# Window status styling
set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=#{@thm_bg},fg=#{@thm_blue}"
set -g window-status-last-style "bg=#{@thm_bg},fg=#{@thm_blue}"
set -g window-status-activity-style "bg=#{@thm_green},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_green},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"
set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=#{@thm_blue},fg=#{@thm_bg},bold"


# ===== SESSION MANAGEMENT =====

# Sesh integration for session management
bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# Don't exit tmux when closing a session
set -g detach-on-destroy off


# ===== INITIALIZATION =====

# Load plugin-specific scripts
run-shell "~/.tmux/plugins/tmux-fzf-links/fzf-links.tmux"

# Initialize plugin manager (must be last)
run '~/.tmux/plugins/tpm/tpm'
