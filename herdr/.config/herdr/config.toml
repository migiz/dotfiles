onboarding = false

[ui.toast]
delivery = "terminal"

[ui.sound]
# Let Windows desktop notifications provide the sound.
enabled = false

[theme]
name = "catppuccin"
auto_switch = false

[theme.custom]
# Let the terminal background show through the tab bar and panels.
panel_bg = "reset"
# Keep the active row distinct from the Navigate-mode cursor.
active_row_bg = "#313244"
selection_bg = "#585b70"
# Brighter Catppuccin separators and secondary labels.
surface_dim = "#585b70"
overlay0 = "#7f849c"

[ui]
# Preserve Fish and Neovim mode-specific cursor shapes on WSL.
host_cursor = "native"
prompt_new_tab_name = false
status_indicators = "symbols"
show_agent_labels_on_pane_borders = true
pane_outer_borders = false
pane_gaps = false
pane_scrollbars = false

[keys]
new_workspace = "prefix+shift+c"
next_agent = "prefix+shift+n"
previous_agent = "prefix+shift+p"
rename_pane = ""
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_up = "up"
navigate_pane_down = "down"
prefix = "ctrl+w"
split_horizontal = "prefix+v"
split_vertical = "prefix+s"
reload_config = "prefix+r"
detach = "prefix+d"
rename_tab = "prefix+comma"
goto = "prefix+t"
settings = "prefix+shift+s"
resize_mode = "prefix+space"

# Navigate between editor splits and Herdr panes.

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

# Keep agent identity once, and give the conversation title its own line.
# Read the terminal title directly rather than Auto Title's numbered tab label.
[ui.sidebar.agents]
rows = [
    ["state_icon", { token = "agent", fg = "#cdd6f4", dim = false },
     { token = "machine", fg = "#bac2de", dim = false },
     { token = "workspace", fg = "#bac2de", dim = false }],
    [{ token = "terminal_title_stripped", fg = "#cdd6f4", dim = false }],
]

[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "ray.file-explorer.open"
description = "open Yazi in a split"

[[keys.command]]
key = "prefix+shift+y"
type = "plugin_action"
command = "ray.file-explorer.open-tab"
description = "open Yazi in a new tab"
