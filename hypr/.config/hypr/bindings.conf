# Application bindings
$terminal = uwsm app -- $TERMINAL
$browser = omarchy-launch-browser

bindd = SUPER, return, Terminal, exec, $terminal --working-directory="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER, F, File manager, exec, uwsm app -- nautilus --new-window
bindd = SUPER, B, Browser, exec, $browser
bindd = SUPER SHIFT, B, Browser (private), exec, $browser --private
bindd = SUPER, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER, N, Neovide, exec, uwsm app -- fish -c neovide
bindd = SUPER, T, Activity, exec, $terminal -e btop
bindd = SUPER, D, Docker, exec, $terminal -e lazydocker
bindd = SUPER, G, Telegram, exec, omarchy-launch-or-focus Telegram "uwsm app -- Telegram"
bindd = SUPER, O, Obsidian, exec, omarchy-launch-or-focus obsidian "uwsm app -- obsidian -disable-gpu --enable-wayland-ime"
bindd = SUPER, slash, Passwords, exec, uwsm app -- bitwarden.desktop
# If your web app url contains #, type it as ## to prevent hyperland treat it as comments
bindd = SUPER, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER, C, Claude, exec, omarchy-launch-webapp "https://claude.ai/new"
bindd = SUPER SHIFT, G, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER, Y, YouTube, exec, omarchy-launch-or-focus-webapp YouTube "https://youtube.com/"
bindd = SUPER, X, X, exec, omarchy-launch-webapp "https://x.com/"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

bindd = SUPER, I, Toggle split, togglesplit, # dwindle
unbind = SUPER, D
bindd = SUPER, D, Discord, exec, omarchy-launch-or-focus vesktop "uwsm app -- vesktop"
bindd = SUPER SHIFT, N, Notion, exec, omarchy-launch-webapp "https://www.notion.so/"

unbind = SUPER ALT, C
bindd = SUPER ALT, C, Screenshot a region, exec, omarchy-cmd-screenshot
unbind = SUPER, W
bindd = SUPER, W, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bind = SUPER, E, exec, setsid -f emacsclient -c -a emacs
bindd = SUPER, Q, Close active window, killactive,

unbind = SUPER, H
unbind = SUPER, J  
unbind = SUPER, K
unbind = SUPER, L
unbind = SUPER SHIFT, H
unbind = SUPER SHIFT, J 
unbind = SUPER SHIFT, K
unbind = SUPER SHIFT, L
unbind = SUPER ALT, H
unbind = SUPER ALT, J 
unbind = SUPER ALT, K
unbind = SUPER ALT, L

# Bind Super + hjkl to move focus (vim-style navigation)
bind = SUPER, H, movefocus, l  # left
bind = SUPER, J, movefocus, d  # down  
bind = SUPER, K, movefocus, u  # up
bind = SUPER, L, movefocus, r  # right

# Resize active window with vim-style keys
bindd = SUPER ALT, h, Expand window left, resizeactive, -100 0     # expand left
bindd = SUPER ALT, j, Expand window down, resizeactive, 0 100      # expand down
bindd = SUPER ALT, k, Expand window up, resizeactive, 0 -100       # expand up  
bindd = SUPER ALT, l, Expand window right, resizeactive, 100 0     # expand right

unbind = SUPER ALT, left
unbind = SUPER ALT, right
unbind = SUPER ALT, up
unbind = SUPER ALT, down

# Resize active window with SUPER + SHIFT + arrow keys
bindd = SUPER ALT, left, Shrink window horizontally, resizeactive, -100 0
bindd = SUPER ALT, right, Expand window horizontally, resizeactive, 100 0
bindd = SUPER ALT, up, Shrink window vertically, resizeactive, 0 -100
bindd = SUPER ALT, down, Expand window vertically, resizeactive, 0 100


# Swap active window with vim-style keys
bindd = SUPER SHIFT, h, Swap window to the left, swapwindow, l
bindd = SUPER SHIFT, j, Swap window down, swapwindow, d  
bindd = SUPER SHIFT, k, Swap window up, swapwindow, u
bindd = SUPER SHIFT, l, Swap window to the right, swapwindow, r

unbind = SUPER ALT, I
bindd = SUPER ALT, I, Show key bindings, exec, omarchy-menu-keybindings

# Gaming mode toggle keybind (added by setup script)
bind = SUPER, F12, exec, /usr/local/bin/switch-to-gaming
